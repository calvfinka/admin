<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Dea</title>
  <style>
    :root { color-scheme: light; --ink:#1c1915; --muted:#6d645b; --line:#e4ddd4; --bg:#f6f3ee; --card:#fff; --mint:#1f6f5b; --danger:#9b2c2c; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.45 "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header, main { width:min(960px, calc(100% - 32px)); margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; padding:20px 0 8px; gap:12px; }
    h1 { font-size:22px; margin:0; }
    h2 { font-size:16px; margin:0 0 8px; }
    p { margin:0; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .btn { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; }
    .btn.mint { background:var(--mint); color:#fff; border-color:var(--mint); }
    .btn.danger { color:var(--danger); }
    .muted { color:var(--muted); font-size:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:16px 0; }
    .stat b { display:block; font-size:28px; margin-top:4px; }
    .bar { display:flex; gap:8px; margin:8px 0 12px; flex-wrap:wrap; }
    .bar input, .bar select { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; }
    .bar input { flex:1; min-width:180px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
    tr.pick { cursor:pointer; }
    tr.on { background:#f3faf7; }
    .tag { font-size:12px; border-radius:999px; padding:2px 8px; background:#eee; }
    .tag.bad { background:#fde8e8; color:var(--danger); }
    .chat { display:flex; flex-direction:column; gap:10px; max-height:420px; overflow:auto; }
    .bubble { border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
    .bubble b { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    .login { max-width:380px; margin:48px auto; display:flex; flex-direction:column; gap:10px; }
    .login input { border:1px solid var(--line); border-radius:12px; padding:12px; }
    .err { color:var(--danger); }
    .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Admin Dea</h1>
      <p class="muted" id="who">Cek akses…</p>
    </div>
    <button type="button" class="btn" id="out" hidden>Keluar</button>
  </header>
  <main>
    <section class="card login" id="gate">
      <h2>Masuk admin</h2>
      <p class="muted">Hanya akun dengan role admin.</p>
      <input id="email" type="email" autocomplete="username" placeholder="Email" />
      <input id="pass" type="password" autocomplete="current-password" placeholder="Password" />
      <button type="button" class="btn mint" id="in">Masuk</button>
      <p class="err" id="gate-msg"></p>
    </section>
    <section id="app" hidden>
      <div class="grid">
        <article class="card stat"><span class="muted">Total user</span><b id="n-user">–</b></article>
        <article class="card stat"><span class="muted">User baru hari ini</span><b id="n-new">–</b></article>
        <article class="card stat"><span class="muted">Total chat</span><b id="n-chat">–</b></article>
      </div>
      <section class="card">
        <h2>User</h2>
        <div class="bar">
          <input id="q" type="search" placeholder="Cari email atau nama" />
          <select id="filter">
            <option value="all">Semua</option>
            <option value="active">Aktif</option>
            <option value="blocked">Diblokir</option>
          </select>
        </div>
        <p class="err" id="list-msg"></p>
        <div style="overflow:auto">
          <table>
            <thead><tr><th>Nama</th><th>Email</th><th>Chat</th><th>Terakhir</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
      <section class="card" id="detail" hidden style="margin-top:12px">
        <h2 id="detail-title">Riwayat</h2>
        <div class="chat" id="history"></div>
      </section>
    </section>
  </main>
  <script src="js/env.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
